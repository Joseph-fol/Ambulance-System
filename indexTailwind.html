<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescuNet | Emergency Dispatch Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased p-4 md:p-8" x-data="ambulanceDemo()">

    <div class="max-w-7xl mx-auto space-y-8">
        <header class="flex justify-between items-center border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-red-500 to-orange-400 bg-clip-text text-transparent">
                    <i class="fa-solid fa-truck-medical mr-2"></i>RescuNet Systems
                </h1>
                <p class="text-slate-400">Next-Gen Emergency Response Interface</p>
            </div>
            <div class="text-right">
                <span class="px-3 py-1 rounded-full bg-green-500/10 text-green-400 text-sm border border-green-500/20">
                    ● System Online
                </span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <section class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                <div class="bg-slate-700/50 p-4 border-b border-slate-600 flex justify-between">
                    <h2 class="font-semibold uppercase tracking-wider text-sm text-slate-300">User Portal</h2>
                    <i class="fa-solid fa-user text-slate-400"></i>
                </div>

                <div class="p-6 min-h-[450px] flex flex-col justify-center">
                    <template x-if="step === 'idle'">
                        <div class="text-center space-y-6">
                            <div class="w-24 h-24 bg-red-500 rounded-full flex items-center justify-center mx-auto animate-pulse shadow-lg shadow-red-500/20">
                                <i class="fa-solid fa-phone-flip text-4xl"></i>
                            </div>
                            <h3 class="text-2xl font-bold">Emergency Detected?</h3>
                            <button @click="startCall()" class="bg-red-600 hover:bg-red-500 text-white px-8 py-4 rounded-xl font-bold text-xl transition-all active:scale-95 shadow-lg">
                                DIAL 911 NOW
                            </button>
                        </div>
                    </template>

                    <template x-if="step === 'calling'">
                        <div class="text-center space-y-6">
                            <div class="relative w-24 h-24 mx-auto">
                                <div class="absolute inset-0 bg-blue-500 rounded-full animate-ping opacity-25"></div>
                                <div class="relative w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-headset text-3xl"></i>
                                </div>
                            </div>
                            <h3 class="text-xl animate-bounce">Calling Dispatch...</h3>
                            <p class="text-slate-400">Ringing tone active 🔊</p>
                            <button @click="reset()" class="text-slate-500 underline text-sm">Cancel</button>
                        </div>
                    </template>

                    <template x-if="step === 'form'">
                        <div class="space-y-4">
                            <h3 class="text-xl font-bold text-blue-400">Emergency Intake Form</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs uppercase text-slate-500 mb-1">Full Name</label>
                                    <input x-model="formData.name" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 focus:border-blue-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs uppercase text-slate-500 mb-1">Nature of Emergency</label>
                                    <select x-model="formData.type" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 focus:border-blue-500 outline-none">
                                        <option value="Medical">Medical</option>
                                        <option value="Fire">Fire</option>
                                        <option value="Accident">Road Accident</option>
                                    </select>
                                </div>
                                <button @click="submitForm()" class="w-full bg-blue-600 py-3 rounded-lg font-bold hover:bg-blue-500 transition">Submit Details</button>
                            </div>
                        </div>
                    </template>

                    <template x-if="step === 'feedback'">
                        <div class="text-center space-y-4">
                            <div :class="{
                                'text-green-500': lastStatus === 'Approved',
                                'text-red-500': lastStatus === 'Rejected',
                                'text-yellow-500': lastStatus === 'Pending'
                            }">
                                <i :class="lastStatus === 'Approved' ? 'fa-check-circle' : 'fa-clock'" class="fa-solid text-6xl"></i>
                            </div>
                            <h3 class="text-2xl font-bold" x-text="'Request ' + lastStatus"></h3>
                            <p class="text-slate-400" x-text="statusMessage"></p>
                            <button @click="reset()" class="mt-4 text-sm text-slate-500 underline">Start New Demo</button>
                        </div>
                    </template>
                </div>
            </section>

            <section class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden flex flex-col">
                <div class="bg-slate-700/50 p-4 border-b border-slate-600 flex justify-between">
                    <h2 class="font-semibold uppercase tracking-wider text-sm text-slate-300">Agent Terminal</h2>
                    <span class="text-xs bg-red-500 px-2 py-0.5 rounded animate-pulse">Live</span>
                </div>

                <div class="p-6 flex-1 space-y-6">
                    <div x-show="step === 'calling'" class="bg-blue-900/30 border border-blue-500/50 p-4 rounded-xl flex items-center justify-between animate-pulse">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-phone-volume text-blue-400"></i>
                            <div>
                                <p class="font-bold">Incoming Web Call</p>
                                <p class="text-xs text-blue-300">ID: #TMP-992</p>
                            </div>
                        </div>
                        <div class="space-x-2">
                            <button @click="acceptCall()" class="bg-green-600 px-4 py-2 rounded-lg text-sm hover:bg-green-500">Pick Up</button>
                            <button @click="rejectCall()" class="bg-red-600 px-4 py-2 rounded-lg text-sm hover:bg-red-500">Reject</button>
                        </div>
                    </div>

                    <div x-show="step === 'reviewing'" class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-4">
                        <h4 class="text-blue-400 font-bold border-b border-slate-700 pb-2">Reviewing Details</h4>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <p class="text-slate-500 uppercase text-[10px]">Name</p>
                            <p class="text-slate-500 uppercase text-[10px]">Type</p>
                            <p x-text="formData.name"></p>
                            <p x-text="formData.type"></p>
                        </div>
                        <div class="flex gap-2">
                            <button @click="finalize('Approved')" class="flex-1 bg-green-600 py-2 rounded shadow-lg shadow-green-900/20 text-sm">Approve</button>
                            <button @click="finalize('Pending')" class="flex-1 bg-yellow-600 py-2 rounded text-sm">Pending</button>
                            <button @click="finalize('Rejected')" class="flex-1 bg-red-600 py-2 rounded text-sm">Reject</button>
                        </div>
                    </div>

                    <div x-show="step === 'idle'" class="h-full flex items-center justify-center text-slate-600 italic">
                        <p>Waiting for incoming activity...</p>
                    </div>
                </div>
            </section>
        </div>

        <section class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="bg-slate-700/50 p-4 border-b border-slate-600">
                <h2 class="font-semibold uppercase tracking-wider text-sm text-slate-300">Emergency Dispatch Records</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]">
                        <tr>
                            <th class="px-6 py-4">Case ID</th>
                            <th class="px-6 py-4">Caller Name</th>
                            <th class="px-6 py-4">Emergency</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                        <template x-for="record in records" :key="record.id">
                            <tr class="hover:bg-slate-700/30 transition">
                                <td class="px-6 py-4 font-mono text-blue-400" x-text="record.id"></td>
                                <td class="px-6 py-4 font-semibold" x-text="record.name"></td>
                                <td class="px-6 py-4" x-text="record.type"></td>
                                <td class="px-6 py-4">
                                    <span :class="{
                                        'bg-green-500/20 text-green-400': record.status === 'Approved',
                                        'bg-red-500/20 text-red-400': record.status === 'Rejected',
                                        'bg-yellow-500/20 text-yellow-400': record.status === 'Pending'
                                    }" class="px-2 py-1 rounded text-[10px] font-bold uppercase" x-text="record.status"></span>
                                </td>
                                <td class="px-6 py-4 text-slate-500 text-xs" x-text="record.time"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        function ambulanceDemo() {
            return {
                step: 'idle', // idle, calling, form, reviewing, feedback
                formData: { name: '', type: 'Medical' },
                records: [
                    { id: '#001', name: 'James Wilson', type: 'Medical', status: 'Approved', time: '12:05 PM' },
                    { id: '#002', name: 'Unknown', type: 'Prank', status: 'Rejected', time: '12:10 PM' }
                ],
                lastStatus: '',
                statusMessage: '',

                startCall() {
                    this.step = 'calling';
                },
                acceptCall() {
                    this.step = 'form';
                },
                rejectCall() {
                    this.lastStatus = 'Rejected';
                    this.statusMessage = 'Dispatch rejected the call. Busy signal...';
                    this.step = 'feedback';
                },
                submitForm() {
                    this.step = 'reviewing';
                },
                finalize(status) {
                    this.lastStatus = status;
                    this.statusMessage = status === 'Approved' ? 'Unit dispatched! ETA 5 mins.' : 'The request is being processed or was denied.';
                    
                    // Add to table
                    this.records.unshift({
                        id: '#' + Math.floor(Math.random()*900 + 100),
                        name: this.formData.name || 'Anonymous',
                        type: this.formData.type,
                        status: status,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    
                    this.step = 'feedback';
                },
                reset() {
                    this.step = 'idle';
                    this.formData = { name: '', type: 'Medical' };
                }
            }
        }
    </script>
</body>
</html>
